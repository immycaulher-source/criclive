<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>NPL Live Score</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#2a2a2a;--pg:#fdf9f7;--card:#e1e4f0;--art:#aeaea4;--txt:#111;--blue:#1785ea;--red:#ee1932;--mar:#7a3535}
*{box-sizing:border-box}
html, body{width:100%;min-height:100vh;margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,Arial,sans-serif}

/* Full Width Top Section spanning entire screen with no bottom margin */
.full-banner{width:100%;background:var(--pg);padding:24px 32px 0;margin-bottom:0}
.top{width:100%;display:flex;gap:24px;align-items:center}

/* Wrapper to support relative positioning for the countdown overlay */
.banner-wrap{
  position:relative;
  flex:1;
  min-width:0;
  width:100%;
}

/* Fixed height & object-fit keep container size constant */
.top img{
  width:100%;
  height:490px;
  object-fit:cover;
  border-radius:12px;
  display:block;
  transition:opacity 0.5s ease-in-out;
}

/* Enhanced High-Visibility Overlay Styling */
.banner-countdown{
  position:absolute;
  top:22%;
  left:50%;
  transform:translate(-50%, -50%);
  width:auto;
  min-width:320px;
  max-width:90%;
  padding:12px 20px;
  border-radius:16px;
  background:rgba(0, 0, 0, 0.45); /* Subtle ambient dark backdrop to ensure readability */
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255, 255, 255, 0.18);
  box-shadow:0 8px 32px rgba(0, 0, 0, 0.5);
  z-index:2;
  text-align:center;
}

.banner-countdown .cd-title{
  font-size:clamp(11px, 1.2vw, 16px);
  text-transform:uppercase;
  letter-spacing:2px;
  color:#ffd700; /* Vibrant Gold Accent */
  font-weight:900;
  margin-bottom:6px;
  white-space:nowrap;
  text-shadow:0 2px 4px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255, 215, 0, 0.3);
}

.banner-countdown .cd-timer{
  display:flex;
  gap:12px;
  font-weight:900;
  font-size:clamp(18px, 2.2vw, 30px);
  justify-content:center;
  align-items:center;
}

.banner-countdown .cd-unit{
  display:flex;
  flex-direction:column;
  align-items:center;
  color:#ffffff;
}

/* Stylized Pill Slot around numerical values for strong pop-out contrast */
.banner-countdown .cd-unit div{
  background:rgba(0, 0, 0, 0.6);
  padding:4px 10px;
  border-radius:8px;
  border:1px solid rgba(255, 215, 0, 0.3);
  color:#ffffff;
  min-width:44px;
  text-shadow:0 2px 6px rgba(0, 0, 0, 0.9);
  box-shadow:inset 0 1px 2px rgba(255, 255, 255, 0.2), 0 4px 10px rgba(0, 0, 0, 0.4);
}

.banner-countdown .cd-unit span{
  font-size:clamp(9px, 0.8vw, 11px);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
  color:#ffd700;
  margin-top:4px;
  text-shadow:0 1px 3px rgba(0, 0, 0, 0.9);
}

/* Full width main container directly connected */
.pg{width:100%;background:var(--pg);padding:20px 32px 32px;border-radius:0}
.nav{display:flex;flex-direction:column;gap:12px;width:300px;flex-shrink:0}
.btn{border:0;border-radius:14px;padding:14px;color:#fff;font:700 18px Inter,system-ui,sans-serif;text-transform:uppercase;background:var(--blue);cursor:pointer;text-align:center;text-decoration:none}
.btn.r{background:var(--red)}

/* Grid starts immediately below the banner with zero top margin */
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:0}
.two.no-live{grid-template-columns:1fr}
.box{background:var(--card);border-radius:22px;padding:18px;min-width:0}
#live-box{display:none} /* Hidden by default until a live match exists */

/* Container for upcoming cards */
.up-cards-container{display:grid;grid-template-columns:1fr 1fr;gap:24px}

.tag{text-align:right;font-weight:800;font-size:19px;padding-right:12px}
.live{color:#ff4b4b}.up{color:#2b55d9}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}

.sl{flex:0 0 100%;scroll-snap-align:start;min-height:200px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;gap:10px}

.tm{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:20px}
.tm b{font-weight:800;white-space:nowrap}.sm{font-size:14px;opacity:.75}
.dots{display:flex;justify-content:center;gap:6px;margin:6px 0 10px}
.dots i{width:8px;height:8px;border-radius:50%;background:#8a8fa8;opacity:.5}.dots i.on{opacity:1;background:var(--blue)}
.acts{display:flex;gap:12px}.acts .btn{flex:1;font-size:17px;padding:14px 8px}
h2{color:var(--mar);font-size:24px;margin:28px 0 14px 0;text-transform:uppercase}
.arts{display:flex;gap:32px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 0 4px}
.arts::-webkit-scrollbar{display:none}
.art{flex:0 0 335px;height:312px;background:var(--art) center/cover;border-radius:26px;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;font-weight:800;font-size:18px;color:#111;overflow:hidden}
.art.img{color:#fff;background-blend-mode:multiply}
.art small{font-weight:500;opacity:.85;margin-top:6px}
.pulse{animation:p .6s}@keyframes p{from{background:#ffe27a}}
#md{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#md.on{display:flex}
#mb{background:var(--pg);border-radius:18px;max-width:800px;width:100%;max-height:85vh;overflow:auto;padding:24px}
#mb h3{margin:14px 0 6px;color:var(--mar)}#mb p{margin:6px 0;font-size:15px}
#mb table{width:100%;border-collapse:collapse;font-size:14px;display:block;overflow-x:auto}
#mb td,#mb th{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid #0002}
#mb td:first-child,#mb th:first-child{text-align:left}

/* Styling for modal images */
.modal-img{width:100%;height:auto;border-radius:12px;margin:12px 0 0;display:block}

.x{float:right;background:var(--red);color:#fff;border:0;border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer}
@media(max-width:820px){
  .full-banner{padding:16px 16px 0}
  .pg{padding:16px}
  .top{flex-direction:column}.nav{width:100%;flex-direction:row;flex-wrap:wrap}.nav .btn{flex:1;font-size:14px}
  .top img{height:200px}
  .banner-countdown{min-width:280px;padding:8px 12px}
  .banner-countdown .cd-timer{gap:6px}
  .banner-countdown .cd-unit div{padding:2px 6px;min-width:32px}
  .two{grid-template-columns:1fr;margin:0}
  .up-cards-container{grid-template-columns:1fr}
  .art{flex-basis:82%}.arts{gap:16px}
}
</style></head><body>

<!-- Full Width Top Section -->
<div class="full-banner">
  <div class="top">
    <div class="banner-wrap">
      <img id="banner-img" alt="NPL Banner" src="news23-0d0b60e2-d79d212c-1dfd-4ec4-aca2-c0f798c06e3a.jpg">
      
      <!-- Overlay Countdown Timer with Pop-Out High-Contrast Design -->
      <div class="banner-countdown">
        <div class="cd-title">Starts (Oct 26)</div>
        <div class="cd-timer">
          <div class="cd-unit"><div id="cd-days">00</div><span>Days</span></div>
          <div class="cd-unit"><div id="cd-hours">00</div><span>Hrs</span></div>
          <div class="cd-unit"><div id="cd-mins">00</div><span>Min</span></div>
          <div class="cd-unit"><div id="cd-secs">00</div><span>Sec</span></div>
        </div>
      </div>
    </div>

    <div class="nav">
      <button class="btn" id="bf">Results and Fixtures</button>
      <button class="btn" id="bp">Points Table</button>
      
      <button class="btn" id="bc">Live Streams</button>
      <a class="btn" id="bs" href="https://events.khalti.com/" target="_blank" rel="noopener">Tickets</a>
      <button class="btn" id="bn">News</button>
    </div>
  </div>
</div>

<div class="pg">
<!-- Main Section Grid connected directly to top container -->
<div class="two no-live" id="grid-container">
  <!-- Live Match Card -->
  <div class="box" id="live-box">
    <div class="tag live">LIVE</div>
    <div class="car" id="lc"></div>
    <div class="dots" id="ld"></div>
    <div class="acts">
      <button class="btn r" data-k="scorecard" data-c="lc">Scorecard</button>
      <button class="btn" data-k="commentary" data-c="lc">Commentary</button>
    </div>
  </div>
  
  <!-- Upcoming Matches Container -->
  <div class="up-cards-container">
    <div class="box">
      <div class="tag up">UPCOMING</div>
      <div id="uc1"></div>
    </div>
    <div class="box">
      <div class="tag up">UPCOMING</div>
      <div id="uc2"></div>
    </div>
  </div>
</div>

<h2 id="mc">Match Center</h2><div class="arts" id="ar"></div>
</div>
<div id="md"><div id="mb"></div></div>
<script>
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function api(p){return fetch('/api/'+p).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
var sid=null;
function when(t){return new Date(t).toLocaleString([],{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
function slide(m,up){return '<div class="sl" data-id="'+m.id+'"><div class="sm">'+esc(m.series)+' · '+esc(m.desc)+'</div>'
 +'<div class="tm"><span>'+esc(m.t1.name)+'</span><b class="s1">'+esc(m.t1.score)+'</b></div>'
 +'<div class="tm"><span>'+esc(m.t2.name)+'</span><b class="s2">'+esc(m.t2.score)+'</b></div>'
 +'<div class="sm st">'+esc(up?when(m.start):m.status)+'</div><div class="sm">'+esc(m.venue)+'</div></div>'}
function empty(t){return '<div class="sl"><div class="tm"><span>'+t+'</span></div></div>'}

/* October 26 Countdown Timer Logic */
(function(){
  function updateCountdown() {
    var now = new Date();
    var targetYear = now.getFullYear();
    var targetDate = new Date(targetYear, 9, 26, 0, 0, 0); // October is month index 9
    
    // If October 26 for this year has passed, count down to next year's October 26
    if (now > targetDate) {
      targetDate = new Date(targetYear + 1, 9, 26, 0, 0, 0);
    }
    
    var diff = targetDate - now;
    if (diff <= 0) return;

    var days = Math.floor(diff / (1000 * 60 * 60 * 24));
    var hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    var minutes = Math.floor((diff / 1000 / 60) % 60);
    var seconds = Math.floor((diff / 1000) % 60);

    $('cd-days').textContent = days < 10 ? '0' + days : days;
    $('cd-hours').textContent = hours < 10 ? '0' + hours : hours;
    $('cd-mins').textContent = minutes < 10 ? '0' + minutes : minutes;
    $('cd-secs').textContent = seconds < 10 ? '0' + seconds : seconds;
  }
  
  updateCountdown();
  setInterval(updateCountdown, 1000);
})();

/* Banner Rotation Logic (Every 10 seconds) */
(function(){
  var bannerImages = [
    "news23-0d0b60e2-d79d212c-1dfd-4ec4-aca2-c0f798c06e3a.jpg",
    "banner2.jpeg",
    "banner3.jpeg"
  ];
  var idx = 0;
  var el = $('banner-img');
  if(el && bannerImages.length > 1){
    setInterval(function(){
      el.style.opacity = '0';
      setTimeout(function(){
        idx = (idx + 1) % bannerImages.length;
        el.src = bannerImages[idx];
        el.style.opacity = '1';
      }, 500);
    }, 10000);
  }
})();

function drawLive(list){
 var c=$('lc'), lb=$('live-box'), gc=$('grid-container');
 
 if(!list || !list.length){
   lb.style.display='none';
   gc.classList.add('no-live');
   return;
 }
 lb.style.display='block';
 gc.classList.remove('no-live');

 if(list[0])sid=list[0].seriesId;
 var ids=list.map(function(m){return m.id}).join(),cur=[].map.call(c.children,function(e){return e.dataset.id}).join();
 if(ids!=cur){c.innerHTML=list.map(function(m){return slide(m)}).join('');return}
 list.forEach(function(m,i){var e=c.children[i];[['.s1',m.t1.score],['.s2',m.t2.score],['.st',m.status]].forEach(function(p){var n=e.querySelector(p[0]);if(n.textContent!=p[1]){n.textContent=p[1];n.classList.remove('pulse');void n.offsetWidth;n.classList.add('pulse')}})})}

// Populate both original-styled upcoming cards
// Custom NPL 2026 opening fixtures (hard-coded, no API). Times are Nepal time (UTC+05:45).
var NPL=[
 {id:'',series:'Nepal Premier League 2026',desc:'Match 1',venue:'TU International Cricket Ground, Kirtipur',start:Date.parse('2026-10-26T16:30:00+05:45'),t1:{name:'Lumbini Lions',score:''},t2:{name:'Sudurpaschim Royals',score:''}},
 {id:'',series:'Nepal Premier League 2026',desc:'Match 2',venue:'TU International Cricket Ground, Kirtipur',start:Date.parse('2026-10-27T12:30:00+05:45'),t1:{name:'Biratnagar Kings',score:''},t2:{name:'Chitwan Rhinos',score:''}}
];
function tickNpl(){NPL.forEach(function(m,i){var e=$('uc'+(i+1)).querySelector('.st'),ms=m.start-Date.now();
 e.textContent=when(m.start)+' · '+(ms>0?'starts in '+Math.floor(ms/864e5)+'d '+Math.floor(ms%864e5/36e5)+'h '+Math.floor(ms%36e5/6e4)+'m':'match time')})}
NPL.forEach(function(m,i){$('uc'+(i+1)).innerHTML=slide(m,1)});
tickNpl();setInterval(tickNpl,60000);

api('rss').then(function(l){$('ar').innerHTML=l.slice(0,15).map(function(a){var im=a.image?'style="text-decoration:none;background-image:linear-gradient(#0000,#000c),url(\''+esc(a.image.replace(/'/g,'%27'))+'\')"':'style="text-decoration:none"';return '<a class="art'+(a.image?' img':'')+'" href="'+esc(a.link)+'" target="_blank" rel="noopener" '+im+'>'+esc(a.title)+'<small>'+esc(a.source)+(a.intro?' · '+esc(a.intro):'')+'</small></a>'}).join('')||'<div class="art">No articles yet</div>'}).catch(function(){$('ar').innerHTML='<div class="art">Could not load articles</div>'});
api('live').then(drawLive).catch(function(){$('live-box').style.display='none';$('grid-container').classList.add('no-live')});
var es=new EventSource('/api/stream');es.addEventListener('live',function(e){drawLive(JSON.parse(e.data))});

/* sliders */
function slider(el,dots,step){var d=dots&&$(dots),hold=0;
 function mark(){if(!d)return;var n=el.children.length;if(d.children.length!=n)d.innerHTML=Array(n+1).join('<i></i>');var k=Math.round(el.scrollLeft/step());for(var i=0;i<n;i++)d.children[i].className=i==k?'on':''}
 el.addEventListener('scroll',mark);['pointerdown','touchstart','mouseenter'].forEach(function(e){el.addEventListener(e,function(){hold=1})});['mouseleave','touchend'].forEach(function(e){el.addEventListener(e,function(){hold=0})});
 setInterval(function(){mark();if(hold)return;var s=step(),max=el.scrollWidth-el.clientWidth;el.scrollTo({left:el.scrollLeft+s>max-4?0:el.scrollLeft+s,behavior:'smooth'})},3500)}
slider($('lc'),'ld',function(){return $('lc').clientWidth});
slider($('ar'),null,function(){var a=$('ar').children[0];return a?a.offsetWidth+parseFloat(getComputedStyle($('ar')).columnGap):300});

/* modal */
function open(h){$('mb').innerHTML='<button class="x" onclick="$(\'md\').classList.remove(\'on\')">Close</button>'+h;$('md').classList.add('on')}
$('md').onclick=function(e){if(e.target==this)this.classList.remove('on')};
function tbl(h,rows){return '<table><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr>'+rows.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+esc(x)+'</td>'}).join('')+'</tr>'}).join('')+'</table>'}
function vals(o){return Object.keys(o||{}).map(function(k){return o[k]})}
function rScard(d){var a=d.scoreCard||[];if(!a.length)return '<p>Scorecard not available yet.</p>';return a.map(function(x){var b=x.batTeamDetails||{},w=x.bowlTeamDetails||{},s=x.scoreDetails||{};
 return '<h3>'+esc(b.batTeamName)+' '+esc(s.runs)+'/'+esc(s.wickets)+' ('+esc(s.overs)+')</h3>'
 +tbl(['Batter','R','B','4s','6s','SR'],vals(b.batsmenData).map(function(p){return [p.batName+(p.outDesc?' — '+p.outDesc:''),p.runs,p.balls,p.fours,p.sixes,p.strikeRate]}))
 +tbl(['Bowler','O','M','R','W','Econ'],vals(w.bowlersData).map(function(p){return [p.bowlName,p.overs,p.maidens,p.runs,p.wickets,p.economy]}))}).join('')}
function rComm(d){var a=d.commentaryList||[];return a.length?a.map(function(c){return '<p>'+(c.overNumber?'<b>'+esc(c.overNumber)+'</b> ':'')+esc(String(c.commText||'').replace(/B\d+\$/g,''))+'</p>'}).join(''):'<p>Commentary not available yet.</p>'}
function rPts(d){var g=d.pointsTable||[];return g.length?g.map(function(x){return '<h3>'+esc(x.groupName||'Points Table')+'</h3>'+tbl(['Team','P','W','L','NR','Pts','NRR'],(x.pointsTableInfo||[]).map(function(t){return [t.teamName,t.matchesPlayed,t.matchesWon,t.matchesLost,t.noRes,t.points,t.nrr]}))}).join(''):'<p>Points Table not available yet</p>'}
function show(p,r,t){open('<h3>'+t+'</h3><p>Loading…</p>');api(p).then(function(d){open('<h3>'+t+'</h3>'+r(d))}).catch(function(){open('<h3>'+t+'</h3><p>Could not load. Try again shortly.</p>')})}
document.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){var c=$(b.dataset.c),s=c.children[Math.round(c.scrollLeft/c.clientWidth)],id=s&&s.dataset.id;if(!id)return;show(b.dataset.k+'/'+id,b.dataset.k=='scorecard'?rScard:rComm,b.textContent)}});
$('bp').onclick=function(){sid?show('points/'+sid,rPts,'Points Table'):open('<p>League not started yet.</p>')};
$('bn').onclick=function(){$('mc').scrollIntoView({behavior:'smooth'})};

/* Tickets button is a normal link (see #bs in the nav) */

/* Live Streams button: where to watch */
$('bc').onclick=function(){
  var c='style="text-align:left;white-space:normal;padding:10px 12px"';
  var rows=[['Nepal','Star Sports Nepal','DishHome Go, Star Sports App'],['India','Star Sports Select 1 (HD)','FanCode'],['Other countries','To Be Announced','Waiting For Official Announcements']];
  open('<h3>Live Streams</h3><table style="display:table;width:100%"><tr>'+['Country','TV Channel','Live Streaming'].map(function(h){return '<th '+c+'>'+h+'</th>'}).join('')+'</tr>'+rows.map(function(r){return '<tr>'+r.map(function(x,i){return '<td '+c+'>'+(i?'':'<b>')+esc(x)+(i?'':'</b>')+'</td>'}).join('')+'</tr>'}).join('')+'</table>');
};

/* Updated Results and Fixtures Click Handler to keep API calls active but render ONLY the image */
$('bf').onclick=function(){
  var fixtureImg = "schedule.jpg";
  open('<h3>Season 3-Fixtures</h3><p>Loading…</p>');
  
  Promise.all([api('recent'),api('upcoming')]).then(function(r){
    open('<h3>Fixtures</h3><img src="' + fixtureImg + '" class="modal-img" alt="Match Schedule Image">');
  }).catch(function(){
    open('<h3>Fixtures</h3><img src="' + fixtureImg + '" class="modal-img" alt="Match Schedule Image">');
  });
};
</script></body></html>
